project:
  type: website
  resources:
    - www/fonts/*
    - www/icons/*
    - www/js/*

execute:
  freeze: true

website:
  search: false
  page-navigation: true
  open-graph: true
  repo-url: https://github.com/jgoliv/jgoliv.github.io
  repo-actions: [source]

  navbar:
    title: false
    left:
      - icon: house
        text: " "
        href: index.qmd
        aria-label: Home
      - text: "About"
        href: index.qmd#about-me

  page-footer:
    border: false
    left: Website made with <a href="https://quarto.org"><span class="footer-quarto-icon" aria-hidden="true"></span>Quarto</a> v.{{< version >}}

format:
  html:
    link-external-icon: true
    link-external-newwindow: true
    code-copy: true
    smooth-scroll: true
    toc: true
    theme: www/themes/theme-light.scss
    highlight-style: www/themes/custom-highlight.theme
    fontsize: 16px
    grid:
      body-width: 900px
    include-after-body:
      text: <script src="/www/js/cursor.js"></script>
