on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Register minimal Jupyter kernel
        run: |
          pip install jupyter
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Fetch kuratowski article
        run: |
          set -e
          DEST="portfolio/data-viz/kuratowski-closure-complement"
          git clone --depth 1 "https://github.com/jgoliv/kuratowski-theorem-visualization.git" /tmp/kuratowski-theorem-visualization

          mkdir -p "$DEST/files"
          cp /tmp/kuratowski-theorem-visualization/article.qmd "$DEST/"
          cp /tmp/kuratowski-theorem-visualization/files/plot.png "$DEST/files/"

          rm -rf /tmp/kuratowski-theorem-visualization

      - name: Fetch midi-to-tablature article
        run: |
          set -e
          DEST="portfolio/machine-learning/midi-to-tablature"
          git clone --depth 1 "https://github.com/jgoliv/guitar-tab-masked-nn-model.git" /tmp/guitar-tab-masked-nn-model

          mkdir -p "$DEST/assets/animations" "$DEST/assets/references"
          cp /tmp/guitar-tab-masked-nn-model/article/article.qmd "$DEST/"
          cp /tmp/guitar-tab-masked-nn-model/article/assets/animations/TrackTokenization.mp4 "$DEST/assets/animations/"
          cp /tmp/guitar-tab-masked-nn-model/article/assets/references/references.bib "$DEST/assets/references/"

          SRC_FREEZE=/tmp/guitar-tab-masked-nn-model/article/_freeze/article
          if [ -d "$SRC_FREEZE" ]; then
            mkdir -p "_freeze/$DEST"
            cp -r "$SRC_FREEZE" "_freeze/$DEST/article"
          fi

          rm -rf /tmp/guitar-tab-masked-nn-model

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
